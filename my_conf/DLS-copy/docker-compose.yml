version: '3.9'

services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: always
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    container_name: dlsbot_app
    #env_file:
      #- ./back/.env
    environment:
      APP_HOME: /var/app
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PWD: ${DB_PWD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      RUN_MODE: app
    volumes:
      - dlsmedia:/var/app/media
      - ./back/static:/var/app/static
      - ./back/staticfiles:/var/app/staticfiles
      - ./back/templates:/var/app/templates
      - ./back/app:/var/app/app
    networks:
      db_network:
        aliases: [dlsbot_app]
      default:

  bot:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: always
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    container_name: dlsbot_bot
    environment:
      APP_HOME: /var/app
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PWD: ${DB_PWD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      RUN_MODE: bot
    volumes:
      - dlsmedia:/var/app/media
      - ./back/app:/var/app/app
    networks:
      db_network:
        aliases: [dlsbot_bot]
      default:

  scheduler:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: always
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    container_name: dlsbot_scheduler
    environment:
      APP_HOME: /var/app
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PWD: ${DB_PWD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      RUN_MODE: scheduler
    volumes:
      - dlsmedia:/var/app/media
      - ./back/app:/var/app/app
    networks:
      db_network:
        aliases: [dlsbot_scheduler]
      default:


  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: dlsbot_frontend
    ports:
      - 3000:3000
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL}
    networks:
      default:

  nginx:
    image: nginx:1.21-alpine
    container_name: dlsbot_nginx
    links:
      - backend:backend
      - frontend:frontend
    ports:
      - 8024:80
    volumes:
      - ./docker-compose/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx
      - dlsmedia:/var/app/media
      - ./back/static:/var/app/static
      - ./back/staticfiles:/var/app/staticfiles
    depends_on:
      - backend
      - frontend
    networks:
      nginx-proxy:
        aliases: [dlsbot_nginx]
      default:

volumes:
  dlsmedia:
  

networks:
  db_network:
    external: true
  nginx-proxy:
    external: true

